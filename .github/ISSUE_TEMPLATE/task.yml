name: Task
description: A unit of work from the plan
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome this task delivers and why.
    validations:
      required: true
  - type: input
    id: docref
    attributes:
      label: Design doc reference
      placeholder: "arch §10.1"
  - type: textarea
    id: scope
    attributes:
      label: Scope
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests / commands that prove it works.
  - type: textarea
    id: deps
    attributes:
      label: Dependencies
