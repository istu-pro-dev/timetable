openapi: 3.1.0
info:
  title: Timetable API
  version: 0.1.0
  description: |
    REST API of the university timetabling system.

    Authentication: `POST /api/auth/login` sets the `tt_access` (JWT, 15 min) and `tt_refresh`
    (30 days) HttpOnly cookies and returns the access token, which API clients may send as
    `Authorization: Bearer <token>`. Reads of reference data need any authenticated user,
    changes need the `admin` role. Every change is written to the audit log with the
    authenticated user as the actor.

    Errors always have the body `{"error": {"code": "...", "message": "..."}}`:
    400 `invalid_request` (malformed JSON, unknown fields, bad path/query parameter),
    401 `unauthorized`, 403 `forbidden`, 404 `not_found`,
    409 `already_exists` (unique key), `in_use` (deleting a referenced record), `schedule_conflict`,
    422 `validation_failed`, `invalid_reference` (referenced record missing), `constraint_violation`,
    503 `no_database`.
servers:
  - url: /
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: buildings
  - name: room-types
  - name: rooms
  - name: groups
  - name: teachers
  - name: disciplines
  - name: time-grid
  - name: curriculum

paths:
  /api/healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /api/openapi.yaml:
    get:
      tags: [system]
      operationId: getOpenAPI
      summary: This specification
      security: []
      responses:
        "200":
          description: OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  # ------------------------------------------------------------------ auth
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with a local account
      description: |
        Starts a session. Failed attempts are throttled per login and per client IP with
        exponential backoff (429 with `Retry-After`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, password]
              properties:
                login: { type: string, minLength: 1, maxLength: 64, description: Case-insensitive. }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Logged in; `tt_access` and `tt_refresh` cookies are set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The account is disabled (`account_disabled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts (`too_many_attempts`).
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds to wait. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh session and issue a new access token
      description: Uses the `tt_refresh` cookie. The old refresh token becomes invalid.
      security:
        - refreshCookie: []
      responses:
        "200":
          description: New tokens; cookies are replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      description: Revokes the refresh session and clears the cookies. Always succeeds.
      security: []
      responses:
        "204": { description: Logged out. }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: The current account
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NoDatabase" }

  # ------------------------------------------------------------------ buildings
  /api/buildings:
    get:
      tags: [buildings]
      operationId: listBuildings
      summary: List buildings
      responses:
        "200":
          description: Buildings ordered by name.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Building" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [buildings]
      operationId: createBuilding
      summary: Create a building
      requestBody: { $ref: "#/components/requestBodies/BuildingInput" }
      responses:
        "201": { $ref: "#/components/responses/Building" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/buildings/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [buildings]
      operationId: getBuilding
      summary: Get a building
      responses:
        "200": { $ref: "#/components/responses/Building" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [buildings]
      operationId: updateBuilding
      summary: Replace a building
      requestBody: { $ref: "#/components/requestBodies/BuildingInput" }
      responses:
        "200": { $ref: "#/components/responses/Building" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [buildings]
      operationId: deleteBuilding
      summary: Delete a building
      description: Fails with 409 `in_use` while rooms reference it.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ------------------------------------------------------------------ room types
  /api/room-types:
    get:
