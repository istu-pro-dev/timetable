        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [rooms]
      operationId: putRoomAvailability
      summary: Replace the availability exceptions of a room
      requestBody: { $ref: "#/components/requestBodies/Availability" }
      responses:
        "200": { $ref: "#/components/responses/Availability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
