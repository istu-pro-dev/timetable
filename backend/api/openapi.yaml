            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RoomType" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [room-types]
      operationId: createRoomType
      summary: Create a room type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomType" }
      responses:
        "201": { $ref: "#/components/responses/RoomType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/room-types/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Code" }
    get:
      tags: [room-types]
      operationId: getRoomType
      summary: Get a room type
      responses:
        "200": { $ref: "#/components/responses/RoomType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [room-types]
      operationId: updateRoomType
      summary: Rename a room type (the code is immutable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/Name" }
      responses:
        "200": { $ref: "#/components/responses/RoomType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [room-types]
      operationId: deleteRoomType
      summary: Delete a room type
      description: Fails with 409 `in_use` while rooms or curriculum items reference it.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

